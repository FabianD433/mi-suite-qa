name: QA Suite (API + E2E)

on:
  push:
    branches: [main]
    # Cambios solo de documentación no disparan la suite E2E (~11 min).
    paths-ignore: ['**.md']
  schedule:
    # 08:00 UTC = 02:00 en Costa Rica (UTC-6, sin horario de verano)
    - cron: '0 8 * * *'
  workflow_dispatch:

# Las suites comparten la cuenta de QA en qa2: nunca dos ejecuciones a la vez.
concurrency:
  group: qa-suite-qa2
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: 'true'
      HEADLESS: 'true'
      DATASCEND_BASE_URL: ${{ vars.DATASCEND_BASE_URL || 'https://qa2.datascend.net' }}
      DATASCEND_EMAIL: ${{ secrets.DATASCEND_EMAIL }}
      DATASCEND_PASSWORD: ${{ secrets.DATASCEND_PASSWORD }}
      # Opcionales: si no existen llegan vacías y los casos que las necesitan se omiten (skipIf).
      DATASCEND_USER_B_EMAIL: ${{ secrets.DATASCEND_USER_B_EMAIL }}
      DATASCEND_USER_B_PASSWORD: ${{ secrets.DATASCEND_USER_B_PASSWORD }}
      DATASCEND_NEW_USER_EMAIL: ${{ secrets.DATASCEND_NEW_USER_EMAIL }}
      DATASCEND_NEW_USER_PASSWORD: ${{ secrets.DATASCEND_NEW_USER_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verificar secretos obligatorios
        run: |
          if [ -z "$DATASCEND_EMAIL" ] || [ -z "$DATASCEND_PASSWORD" ]; then
            echo "::error::Faltan los secrets DATASCEND_EMAIL y/o DATASCEND_PASSWORD"
            exit 1
          fi

      # Librerías de sistema que Chrome for Testing necesita en Ubuntu 24.04 (ubuntu-latest).
      # apt resuelve los nombres "t64" de noble (p. ej. libcups2 → libcups2t64).
      - name: Instalar dependencias de sistema de Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 \
            libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64 \
            libpango-1.0-0 libcairo2 fonts-liberation

      # El postinstall de vibium descarga Chrome for Testing, pero si falla solo avisa;
      # `vibium install` lo garantiza (y es no-op si ya está).
      - name: Instalar dependencias
        run: |
          npm ci
          npx vibium install

      # Falla rápido y con diagnóstico (stderr de Chrome) si el navegador no arranca, en vez de
      # cascada de BrowserCrashedError en todos los specs. Los flags de contenedor se agregan en
      # tests/support/datascend.ts para la suite; aquí se pasan explícitamente.
      - name: Smoke test de Chrome (Vibium)
        env:
          VIBIUM_CHROME_ARGS: --no-sandbox --disable-setuid-sandbox --disable-dev-shm-usage
          VIBIUM_STDERR: '1'
        run: |
          node -e "
            const { browser } = require('vibium');
            (async () => {
              const b = await browser.start({ headless: true });
              const p = await b.page();
              await p.go('data:text/html,<title>ok</title>');
              console.log('Chrome OK:', await p.evaluate('navigator.userAgent'));
              await b.stop();
            })().catch((e) => { console.error(e); process.exit(1); });
          "

      # Errores de compilación o imports rotos fallan aquí en segundos, antes de levantar Chrome.
      - name: Typecheck (tsc)
        run: npm run typecheck

      - name: Tests de API (tests/APIs)
        id: api
        env:
          VITEST_HTML_DIR: reports/api
        run: npx vitest run tests/APIs

      - name: Tests E2E (headless, en serie)
        id: e2e
        if: ${{ !cancelled() && steps.api.outcome != 'skipped' }}
        env:
          VITEST_HTML_DIR: reports/e2e
        run: npx vitest run --no-file-parallelism --exclude "tests/APIs/**"

      - name: Subir reports/
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: qa-reports-${{ github.run_number }}-${{ github.run_attempt }}
          path: reports/
          if-no-files-found: warn
          retention-days: 14
